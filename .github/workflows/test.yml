name: "CI"
on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
      - name: Build + package + tests
        run: |
          npm run all

  test: # make sure the action works on a clean machine without building
    strategy:
      matrix:
        os: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["windows-latest", "ubuntu-latest", "macos-latest", "ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          groovy-version: 5.x
      - name: Echo GROOVY_HOME
        run: echo $GROOVY_HOME
      - name: Display groovy version
        run: groovy --version
